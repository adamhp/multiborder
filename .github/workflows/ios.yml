name: iOS

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  test:
    name: Build and test
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'
      - name: Read Xcode version
        id: xcode
        run: echo "version=$(xcodebuild -version | tr -s '\n ' '-' | sed 's/-$//')" >> "$GITHUB_OUTPUT"
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: DerivedData
          key: ${{ runner.os }}-xcode-${{ steps.xcode.outputs.version }}-deriveddata-${{ hashFiles('multiborder.xcodeproj/project.pbxproj', '**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ steps.xcode.outputs.version }}-deriveddata-
      - name: Test
        run: |
          xcodebuild test \
            -project multiborder.xcodeproj \
            -scheme multiborder \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO
      - name: Build Release
        run: |
          xcodebuild build \
            -project multiborder.xcodeproj \
            -scheme multiborder \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO
      - name: Drop logs before caching
        # Logs and result bundles would otherwise pile up in every saved cache.
        if: always()
        run: rm -rf DerivedData/Logs
