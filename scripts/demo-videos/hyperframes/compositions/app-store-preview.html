<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=886, height=1920" />
    <!-- App Store preview: the real cut footage (assets/cut.mp4, from cuts.py) with one caption per beat. -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* The app's own UI font (copied from Shared/SpaceMono.ttf by render.sh). */
      @font-face { font-family: "Space Mono"; src: url("../assets/SpaceMono.ttf") format("truetype"); font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 886px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 886px; height: 1920px; }
      #footage { position: absolute; inset: 0; width: 886px; height: 1920px; object-fit: cover; }
      .caption {
        position: absolute;
        top: 118px;
        left: 0;
        right: 0;
        width: fit-content;
        margin: 0 auto;
        white-space: nowrap;
        padding: 18px 30px;
        border-radius: 999px;
        background: #1c1917;
        border: 2px solid rgba(217, 119, 6, 0.55);
        color: #f5f5f4;
        font-family: "Space Mono", ui-monospace, Menlo, monospace;
        font-weight: 400;
        font-size: 34px;
        letter-spacing: -0.01em;
        opacity: 0;
      }
      .caption b { color: #f59e0b; font-weight: 400; }
      /* On the Select screen the top holds the picker's bar and Done button: sit over the bottom row of photos, which the storyboard never taps. */
      .caption.low { top: 1290px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="app-store-preview" data-start="0" data-duration="22.3" data-width="886" data-height="1920">
      <video id="footage" class="clip" src="../assets/cut.mp4" muted playsinline data-start="0" data-duration="22.3" data-track-index="0"></video>
      <div id="c-select" class="caption low clip" data-start="0" data-duration="4.63" data-track-index="1">Border all your photos at once</div>
      <div id="c-size" class="caption clip" data-start="4.63" data-duration="4.67" data-track-index="1">Size and aspect ratio</div>
      <div id="c-styles" class="caption clip" data-start="9.3" data-duration="6.4" data-track-index="1"><b>New:</b> rounded corners and shadows</div>
      <div id="c-caption" class="caption clip" data-start="15.7" data-duration="2.5" data-track-index="1"><b>New:</b> camera settings caption</div>
      <div id="c-save" class="caption clip" data-start="18.2" data-duration="4.1" data-track-index="1">Ready to share</div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // [caption id, beat start, beat end] — beat starts are printed by cuts.py.
      const beats = [
        ["#c-select", 0, 4.63],
        ["#c-size", 4.63, 9.3],
        ["#c-styles", 9.3, 15.7],
        ["#c-caption", 15.7, 18.2],
        ["#c-save", 18.2, 22.3],
      ];
      for (const [id, start, end] of beats) {
        tl.fromTo(id, { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, start + 0.15);
        if (end < 22.3) tl.to(id, { opacity: 0, duration: 0.25, ease: "power1.in" }, end - 0.3);
      }
      window.__timelines = window.__timelines || {};
      window.__timelines["app-store-preview"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
