<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1440, height=1080" />
    <!-- Website spotlight "Borders your way": a sample photo on a white border rounds its corners,
         gains a shadow, then a deeper bottom border, and eases back so the loop is seamless. -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1440px; height: 1080px; overflow: hidden; background: #262626; }
      #root { width: 1440px; height: 1080px; display: flex; align-items: center; justify-content: center; }
      #card {
        background: #ffffff;
        padding: 56px;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      }
      #photo {
        display: block;
        width: 1040px;
        height: 693px;
        object-fit: cover;
        border-radius: 0px;
        box-shadow: 0 0 0 rgba(0, 0, 0, 0);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="border-styles" data-start="0" data-duration="9" data-width="1440" data-height="1080">
      <div id="card" class="clip" data-start="0" data-duration="9" data-track-index="0">
        <img id="photo" src="../assets/IMG_2066.JPG" alt="" />
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const ease = "power2.inOut";
      tl.to("#photo", { borderRadius: 42, duration: 1.4, ease }, 0.8);
      tl.to("#photo", { boxShadow: "0 26px 52px rgba(0, 0, 0, 0.38)", duration: 1.4, ease }, 2.4);
      tl.to("#card", { paddingLeft: 80, paddingRight: 80, paddingBottom: 170, duration: 1.6, ease }, 4.0);
      // Back to the first frame.
      tl.to("#photo", { borderRadius: 0, boxShadow: "0 0 0 rgba(0, 0, 0, 0)", duration: 1.6, ease }, 6.8);
      tl.to("#card", { paddingLeft: 56, paddingRight: 56, paddingBottom: 56, duration: 1.6, ease }, 6.8);
      window.__timelines = window.__timelines || {};
      window.__timelines["border-styles"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
