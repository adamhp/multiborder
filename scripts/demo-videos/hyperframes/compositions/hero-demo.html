<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=886, height=1920" />
    <!-- The website hero's phone demo: the same cut footage with no captions, ending on its own first
         frame so the site's looping <video> wraps around without a jump. -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 886px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 886px; height: 1920px; }
      #footage, #first { position: absolute; inset: 0; width: 886px; height: 1920px; object-fit: cover; }
      #first { opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="hero-demo" data-start="0" data-duration="22.3" data-width="886" data-height="1920">
      <video id="footage" class="clip" src="../assets/cut.mp4" muted playsinline data-start="0" data-duration="22.3" data-track-index="0"></video>
      <img id="first" class="clip" src="../assets/cut-first.jpg" alt="" data-start="21.5" data-duration="0.8" data-track-index="1" />
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.to("#first", { opacity: 1, duration: 0.6, ease: "power1.inOut" }, 21.6);
      window.__timelines = window.__timelines || {};
      window.__timelines["hero-demo"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
